name: build the mod
description: Restores the dashboard bundles and builds Pickle in Release. Needs a checkout first.

inputs:
  dashboard-artifact:
    description: Artifact holding the built dashboard bundles.
    required: false
    default: dashboard-dist

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: 10.0.x

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ inputs.dashboard-artifact }}
        path: Dashboard/dist

    - name: dotnet build
      shell: bash
      run: dotnet build Pickle.slnx -c Release
