version: 2

updates:
  # csproj versions already float on patch ranges, so these PRs are the minor and major
  # bumps that a restore will not pick up on its own.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      # fix cuts a patch release, which is what ships an updated runtime dependency
      prefix: "fix(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # chore is absent from releaseRules, so a CI-only bump does not cut a release
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/Dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "@tailwindcss/vite"
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # TODO(npm bundles a vulnerable undici): delete this once `npm` ships a bundle with
    # undici >= 6.28.1. @semantic-release/npm pulls in npm, npm vendors its own tree, and
    # npm 11.21.0 still bundles undici 6.28.0, so the security updater cannot reach it and
    # errors on every run. The two copies this repo resolves itself are already patched.
    ignore:
      - dependency-name: "undici"
    commit-message:
      prefix: "chore(deps)"
