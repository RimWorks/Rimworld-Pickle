name: sonar

on:
  # pull_request_target, not pull_request: a fork's PR gets no secrets otherwise and the
  # scan dies on an empty token. mod-ci checks out the PR head and passes the PR
  # coordinates to the scanner itself.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      # the image job below needs them, and a caller has to hand them down
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false

permissions:
  contents: read
  # write, not read: the image job pushes to ghcr, and a caller is checked against every
  # nested job
  packages: write

concurrency:
  # github.ref is the base branch under pull_request_target, so key on the PR instead.
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the scan compiles the solution, so it needs staged assemblies like any other build
  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: sonar-image-ref
      windows: false
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  analyze:
    needs: game-image
    permissions:
      contents: read
      # stage-game-refs pulls the image from ghcr
      packages: read
    uses: RimWorks/mod-ci/.github/workflows/sonar.yml@v3
    with:
      game-image: ${{ fromJSON(needs.game-image.outputs.image-refs)['1.6'] }}
      solution: Pickle.slnx
      project-key: RimWorks_Rimworld-Pickle
      exclusions: Dashboard/dist/**,Dashboard/node_modules/**,Styles/**,artifacts/**,**/bin/**,**/obj/**
      coverage-exclusions: Source/Pickle/**,Source/Pickle.Vanilla/**,Source/Pickle.Patches.*/**,Source/Pickle.Ref/**,Dashboard/**,.github/**
      extra-begin-args: >-
        /d:sonar.issue.ignore.multicriteria=todo,ternary,catchname,jsxspacing,ariarole,detailskeys /d:sonar.issue.ignore.multicriteria.todo.ruleKey=csharpsquid:S1135 /d:sonar.issue.ignore.multicriteria.todo.resourceKey=**/*.cs /d:sonar.issue.ignore.multicriteria.ternary.ruleKey=typescript:S3358 /d:sonar.issue.ignore.multicriteria.ternary.resourceKey=**/*.tsx /d:sonar.issue.ignore.multicriteria.catchname.ruleKey=typescript:S7718 /d:sonar.issue.ignore.multicriteria.catchname.resourceKey=**/*.tsx /d:sonar.issue.ignore.multicriteria.jsxspacing.ruleKey=typescript:S6772 /d:sonar.issue.ignore.multicriteria.jsxspacing.resourceKey=**/*.tsx /d:sonar.issue.ignore.multicriteria.ariarole.ruleKey=typescript:S6819 /d:sonar.issue.ignore.multicriteria.ariarole.resourceKey=**/*.tsx /d:sonar.issue.ignore.multicriteria.detailskeys.ruleKey=typescript:S6847 /d:sonar.issue.ignore.multicriteria.detailskeys.resourceKey=**/*.tsx
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
