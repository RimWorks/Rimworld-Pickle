name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      packages: write
      checks: write
      actions: read
    uses: ./.github/workflows/ci.yml
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      DOCBIN_TOKEN: ${{ secrets.DOCBIN_TOKEN }}

  sonar:
    permissions:
      contents: read
      # write: the scan needs staged assemblies, so sonar.yml builds a game image first
      packages: write
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  release:
    name: semantic-release
    needs: [ci, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # stage-game-refs pulls the images from ghcr
      packages: read
    outputs:
      published: ${{ steps.after.outputs.published }}
      version: ${{ steps.after.outputs.version }}
      tag: ${{ steps.after.outputs.tag }}
      previous-tag: ${{ steps.before.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        id: refs-15
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game-1.5

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        id: refs-16
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game-1.6

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        id: refs-17
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.7'] }}
          dest: ${{ runner.temp }}/game-1.7

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLIT_PUBLISH: '1'
          # release.config.mjs builds one leg per version and reads these by name
          GAME_MANAGED_1_5: ${{ steps.refs-15.outputs.managed-dir }}
          GAME_MANAGED_1_6: ${{ steps.refs-16.outputs.managed-dir }}
          GAME_MANAGED_1_7: ${{ steps.refs-17.outputs.managed-dir }}
        run: ./node_modules/.bin/semantic-release

      - name: Read the tag it just cut
        id: after
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$tag" = "${{ steps.before.outputs.tag }}" ] || [ -z "$tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the packed nupkgs
        if: steps.after.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-nupkgs
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload the release zips
        if: steps.after.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: dist/Pickle-*.zip
          if-no-files-found: error

  publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: RimWorks/mod-ci/.github/workflows/publish.yml@v4
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      nupkg-artifact: release-nupkgs
      zip-artifact: release-zips
      discord-mod-name: Pickle
      discord-workshop-id: '3791648678'
      discord-embed-color: 3498DB
      tag: ${{ needs.release.outputs.tag }}
      previous-tag: ${{ needs.release.outputs.previous-tag }}
