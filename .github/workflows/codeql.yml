name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    uses: RimWorks/mod-ci/.github/workflows/codeql.yml@f10430c71960ac8d11c9cfb4b5b31cdfbc83cab9 # v1.5.2
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["csharp", "javascript-typescript", "actions"]'
