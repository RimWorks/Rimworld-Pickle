name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live-dashboard:
        description: Expose Pickle's dashboard over a temporary public URL while the suite runs.
        type: boolean
        default: true
      film:
        description: Record filmed scenarios.
        type: boolean
        default: true
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''
      backend:
        description: Which patch backend to run. A manual run does one, not all three.
        type: choice
        options: [harmony, concord, both]
        default: harmony

# A superseded run is going to be replaced anyway, and the suite is expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install
        working-directory: Dashboard
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: Dashboard
        run: npm run lint

      - name: Build
        working-directory: Dashboard
        run: npm run build

      # The mod embeds these as resources, so the C# job needs them.
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: Dashboard/dist

  prose:
    name: prose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # reviewdog
        with:
          reporter: github-pr-check
          fail_on_error: true

      # A step nobody documented is a step nobody can find, so the catalogue is a build
      # requirement rather than a nicety.
      - name: Step docs
        run: python3 .github/scripts/check-step-docs.py

  links:
    name: links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Relative links break silently when a folder is renamed, which is how the
      # docs -> Docs rename broke the template's link to the authoring guide.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --no-progress README.md 'Docs/**/*.md'
          fail: true

  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    # A called workflow cannot hold more than its caller, and the repo default is read.
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build:
    name: build and test
    needs: [dashboard, game-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v7
        with:
          name: dashboard-dist
          path: Dashboard/dist

      - name: Stage game assemblies from image
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$GAME_IMAGE"
          cid="$(docker create "$GAME_IMAGE")"
          mkdir -p "$RUNNER_TEMP/rimworld/RimWorldLinux_Data"
          # Only the managed assemblies, because the image now carries the whole game.
          docker cp "$cid:/game/RimWorldLinux_Data/Managed" \
            "$RUNNER_TEMP/rimworld/RimWorldLinux_Data/Managed"
          docker rm -f "$cid"

      - name: dotnet build (Krafs reference assemblies)
        run: dotnet build Pickle.slnx -c Release

      - name: Run tests
        run: dotnet test Pickle.slnx -c Release --no-build

  suite:
    name: suite (${{ matrix.backends }})
    needs: [dashboard, game-image]
    runs-on: ubuntu-latest
    # A leg runs the whole suite in about eleven minutes, so this is slack, not a target.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      # Every combination should be reported, not just the first one that breaks.
      fail-fast: false
      matrix:
        # A pull request runs the backend most people have; main covers all three, so a
        # regression in the others is still caught before a release.
        backends: ${{ github.event_name == 'workflow_dispatch'
          && fromJSON(format('["{0}"]', inputs.backend))
          || (github.event_name == 'pull_request'
          && fromJSON('["harmony"]')
          || fromJSON('["harmony","concord","both"]')) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v7
        with:
          name: dashboard-dist
          path: Dashboard/dist

      - name: Build the mod
        run: dotnet build Pickle.slnx -c Release

      - name: Stage mods and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-pickle-mods.sh \
            "${{ matrix.backends }}" "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config"

          # The repo root is the mod folder once it is built. Source and the git
          # history are not part of what ships, so they stay out of the container.
          mkdir -p "$RUNNER_TEMP/mods/Pickle"
          tar -c --exclude=.git --exclude=node_modules --exclude=Source \
              --exclude=Dashboard --exclude=pickle-reports . \
            | tar -x -C "$RUNNER_TEMP/mods/Pickle"

      - name: Run the suite
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On every run except a dispatch that opts out. The URL is random and dies with
          # the job, and the dashboard only ever shows run progress.
          LIVE_DASHBOARD: ${{ github.event_name != 'workflow_dispatch' || inputs.live-dashboard }}
          # Ten frames a second is cheap enough to leave on, so every report carries its
          # video. A dispatch can still turn it off.
          FILM_SECONDS: ${{ github.event_name == 'workflow_dispatch' && !inputs.film && '0' || '60' }}
          SUITE_FILTER: ${{ inputs.suite-filter }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # The image is the whole game, so this is minutes of silence without a marker.
          echo "pulling $GAME_IMAGE ..."
          start=$SECONDS
          docker pull -q "$GAME_IMAGE"
          echo "pulled in $((SECONDS - start))s"

          # The container writes its reports here as root, so the runner has to be able
          # to read them back afterwards.
          mkdir -p "$PWD/pickle-reports"
          chmod 777 "$PWD/pickle-reports"

          # HOME is set here rather than assumed: the image runs as root, so Unity reads
          # its config from /root and a mount under /home/app is silently ignored.
          CFG="/pickle-home/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"
          run_arg="-pickle-run"
          [[ -n "$SUITE_FILTER" ]] && run_arg="-pickle-run=$SUITE_FILTER"
          echo "running: $run_arg"

          # The game image carries no encoder, so one is mounted in when a filmed run
          # actually needs it. A download that fails costs the videos, not the run:
          # FilmEncoder keeps the frames and says so when nothing is on the PATH.
          ffmpeg_mount=()
          if [[ "$FILM_SECONDS" != "0" ]]; then
            if .github/scripts/fetch-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"; then
              ffmpeg_mount=(-v "$RUNNER_TEMP/ffmpeg:/usr/local/bin/ffmpeg:ro")
            else
              echo "::warning title=Pickle film::no ffmpeg, so this run keeps frames and gets no videos"
            fi
          fi

          # Redirected rather than piped, so $! stays the container and its exit code
          # still reaches wait below.
          : > "$RUNNER_TEMP/container.log"
          # --init is load bearing: xvfb-run waits for Xvfb to signal SIGUSR1 to its
          # parent, which never arrives when xvfb-run is itself PID 1.
          docker run --rm --init --name pickle-suite -p 27750:27750 \
            -e HOME=/pickle-home \
            -v "$RUNNER_TEMP/mods:/game/Mods:ro" \
            -v "$RUNNER_TEMP/config:$CFG" \
            -v "$PWD/pickle-reports:/out" \
            "${ffmpeg_mount[@]}" \
            "$GAME_IMAGE" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
              /game/RimWorldLinux "$run_arg" -pickle-http \
                -pickle-max-film-seconds="$FILM_SECONDS" \
                -pickle-report-dir=/out -logfile /out/Player.log \
            > "$RUNNER_TEMP/container.log" 2>&1 &
          game=$!
          echo "game container started, waiting for its log ..."

          tail -n +1 -f "$RUNNER_TEMP/container.log" | sed 's/^/[container] /' &
          container_follow=$!

          # The game writes to its own logfile, so a container that dies says nothing
          # unless its state is dumped here.
          ( sleep 45
            if [[ ! -f pickle-reports/Player.log ]]; then
              echo "no Player.log after 45s; dumping state"
              docker ps -a --filter name=pickle-suite --format '{{.Status}} {{.Image}}'
              ls -la pickle-reports || true
            fi ) &

          # The game says nothing on stdout, so follow its own log and echo the pickle
          # lines. Without this the step is silent for the whole run.
          ( until [[ -f pickle-reports/Player.log ]]; do sleep 1; done
            tail -n +1 -f pickle-reports/Player.log \
              | grep --line-buffered -E '^pickle: ' ) &
          follow=$!

          dashboard=
          if [[ "$LIVE_DASHBOARD" == "true" ]]; then
            # Backgrounded so a slow tunnel cannot hold up the run it is meant to show.
            .github/scripts/expose-dashboard.sh 27750 &
            dashboard=$!
          fi

          # set -e would abort on a failing wait before the status is captured.
          status=0
          wait "$game" || status=$?
          sleep 1
          kill "$follow" "$container_follow" ${dashboard:-} 2>/dev/null || true
          exit "$status"

      - name: Publish the counts
        if: always()
        run: |
          {
            echo "## Pickle suite (${{ matrix.backends }})"
            if [ -f pickle-reports/summary.md ]; then
              tail -n +2 pickle-reports/summary.md
            else
              echo "The run produced no summary. Read Player.log in the artifact below."
            fi
            echo
            echo "[Download **pickle-report-${{ matrix.backends }}**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
            echo "for \`report.html\` (open it in a browser; failures carry screenshots),"
            echo "plus \`junit.xml\` and the full \`Player.log\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the report
        if: always()
        env:
          DOCBIN_TOKEN: ${{ secrets.DOCBIN_TOKEN }}
        run: |
          # Optional: without a token the artifact below is still the fallback.
          if [[ -z "${DOCBIN_TOKEN:-}" ]] || [[ ! -f pickle-reports/report.html ]]; then
            echo "skipping docbin upload (no token or no report)"
            exit 0
          fi

          name="pickle-${{ matrix.backends }}-${{ github.run_id }}"
          out="$(npx -y docbin@1 push pickle-reports/report.html \
            --name "$name" --type html --visibility unlisted --expires 30d 2>&1 | head -1)"
          url="${out%% (*}"

          if [[ "$url" == https://* ]]; then
            echo "::notice title=Pickle report::${url}"
            # GitHub may strip target; it degrades to a normal link if so.
            echo "<a href=\"${url}\" target=\"_blank\" rel=\"noopener\"><strong>Open the report</strong></a> - failures carry screenshots." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docbin upload did not return a url: $out"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pickle-report-${{ matrix.backends }}
          path: pickle-reports/
          if-no-files-found: warn
