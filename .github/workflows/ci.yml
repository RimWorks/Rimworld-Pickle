name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live-dashboard:
        description: Expose Pickle's dashboard over a temporary public URL while the suite runs.
        type: boolean
        default: false
      film:
        description: Record filmed scenarios. Slower, and frame readback is unreliable headless.
        type: boolean
        default: false

# A superseded run is going to be replaced anyway, and the suite is expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install
        working-directory: Dashboard
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: Dashboard
        run: npm run lint

      - name: Build
        working-directory: Dashboard
        run: npm run build

      # The mod embeds these as resources, so the C# job needs them.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: Dashboard/dist

  prose:
    name: prose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # reviewdog
        with:
          reporter: github-pr-check
          fail_on_error: true

  links:
    name: links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Relative links break silently when a folder is renamed, which is how the
      # docs -> Docs rename broke the template's link to the authoring guide.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --no-progress README.md 'Docs/**/*.md'
          fail: true

  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    # A called workflow cannot hold more than its caller, and the repo default is read.
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build:
    name: build and test
    needs: [dashboard, game-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: Dashboard/dist

      - name: Stage game assemblies from image
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$GAME_IMAGE"
          cid="$(docker create "$GAME_IMAGE")"
          mkdir -p "$RUNNER_TEMP/rimworld/RimWorldLinux_Data"
          # Only the managed assemblies, because the image now carries the whole game.
          docker cp "$cid:/game/RimWorldLinux_Data/Managed" \
            "$RUNNER_TEMP/rimworld/RimWorldLinux_Data/Managed"
          docker rm -f "$cid"

      - name: dotnet build (Krafs reference assemblies)
        run: dotnet build Pickle.slnx -c Release

      - name: Run tests
        run: dotnet test Pickle.slnx -c Release --no-build

  suite:
    name: suite (${{ matrix.backends }})
    needs: [dashboard, game-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      # Every combination should be reported, not just the first one that breaks.
      fail-fast: false
      matrix:
        # A pull request runs the backend most people have; main covers all three, so a
        # regression in the others is still caught before a release.
        backends: ${{ github.event_name == 'pull_request'
          && fromJSON('["harmony"]')
          || fromJSON('["harmony","concord","both"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: Dashboard/dist

      - name: Build the mod
        run: dotnet build Pickle.slnx -c Release

      - name: Stage mods and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-pickle-mods.sh \
            "${{ matrix.backends }}" "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config"

          # The repo root is the mod folder once it is built. Source and the git
          # history are not part of what ships, so they stay out of the container.
          mkdir -p "$RUNNER_TEMP/mods/Pickle"
          tar -c --exclude=.git --exclude=node_modules --exclude=Source \
              --exclude=Dashboard --exclude=pickle-reports . \
            | tar -x -C "$RUNNER_TEMP/mods/Pickle"

      - name: Run the suite
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_DASHBOARD: ${{ inputs.live-dashboard }}
          # Filming costs about a fifth of the run and its frame readback is unreliable
          # under software rendering, so it is opt in rather than the default here.
          FILM_SECONDS: ${{ inputs.film && '60' || '0' }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$GAME_IMAGE"

          # The image runs as uid 1000, so the report directory has to be writable by it.
          mkdir -p "$PWD/pickle-reports"
          chmod 777 "$PWD/pickle-reports"

          CFG="/home/app/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"
          docker run --rm -p 27750:27750 \
            -v "$RUNNER_TEMP/mods:/game/Mods:ro" \
            -v "$RUNNER_TEMP/config:$CFG" \
            -v "$PWD/pickle-reports:/out" \
            "$GAME_IMAGE" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
              /game/RimWorldLinux -pickle-run -pickle-http \
                -pickle-max-film-seconds="$FILM_SECONDS" \
                -pickle-report-dir=/out -logfile /out/Player.log &
          game=$!

          # The game says nothing on stdout, so follow its own log and echo the pickle
          # lines. Without this the step is silent for the whole run.
          ( until [[ -f pickle-reports/Player.log ]]; do sleep 1; done
            tail -n +1 -f pickle-reports/Player.log \
              | grep --line-buffered -E '^pickle: ' ) &
          follow=$!

          if [[ "$LIVE_DASHBOARD" == "true" ]]; then
            .github/scripts/expose-dashboard.sh 27750 || true
          fi

          wait "$game"
          status=$?
          sleep 1
          kill "$follow" 2>/dev/null || true
          exit "$status"

      - name: Publish the counts
        if: always()
        run: |
          {
            echo "## Pickle suite (${{ matrix.backends }})"
            if [ -f pickle-reports/summary.md ]; then
              tail -n +2 pickle-reports/summary.md
            else
              echo "The run produced no summary. Read Player.log in the artifact below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickle-report-${{ matrix.backends }}
          path: pickle-reports/
          if-no-files-found: warn
