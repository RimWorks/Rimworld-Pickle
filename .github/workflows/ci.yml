name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      live-dashboard:
        description: Expose Pickle's dashboard over a temporary public URL while the suite runs.
        type: boolean
        default: true
      film:
        description: Record filmed scenarios.
        type: boolean
        default: true
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''
      backend:
        description: Which patch backend to run. Empty runs all three.
        type: string
        default: ''
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
      DOCBIN_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      live-dashboard:
        description: Expose Pickle's dashboard over a temporary public URL while the suite runs.
        type: boolean
        default: true
      film:
        description: Record filmed scenarios.
        type: boolean
        default: true
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''
      backend:
        description: Which patch backend to run. A manual run does one, not all three.
        type: choice
        options: [harmony, concord, both]
        default: harmony

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    uses: RimWorks/mod-ci/.github/workflows/node-build.yml@v1
    with:
      working-directory: Dashboard
      lint: true
      artifact-name: dashboard-dist

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v1
    with:
      extra-command: python3 .github/scripts/check-step-docs.py

  links:
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v1
    with:
      args: --config lychee.toml --no-progress README.md 'Docs/**/*.md'

  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  build:
    name: build and test
    needs: dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-mod

      - name: Run tests
        run: |
          dotnet test Pickle.slnx -c Release --no-build \
            --logger "trx;LogFileName=tests.trx" --results-directory "$RUNNER_TEMP/test-results"

      - name: Publish the test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: unit tests
          path: ${{ runner.temp }}/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: dotnet format
        run: dotnet format Pickle.slnx --verify-no-changes

  suite:
    name: suite
    needs: [dashboard, game-image]
    permissions:
      contents: read
      packages: read
      actions: read
    uses: RimWorks/mod-ci/.github/workflows/pickle-suite.yml@v1
    secrets:
      DOCBIN_TOKEN: ${{ secrets.DOCBIN_TOKEN }}
    with:
      mod-name: Pickle
      mod-package-id: rimworks.pickle
      # the checkout is Pickle, so nothing stages a release of it
      pickle-version: self
      # Pickle's own features are the suite, so there is no filter to fall back to
      unfiltered: true
      suite-filter: ${{ inputs.suite-filter }}
      game-image: ${{ needs.game-image.outputs.image-ref }}
      backends: ${{ inputs.backend != ''
        && format('["{0}"]', inputs.backend)
        || (github.event_name == 'pull_request'
        && '["harmony"]'
        || '["harmony","concord","both"]') }}
      build-command: dotnet build Pickle.slnx -c Release
      # the dashboard bundles are embedded resources, so the build needs them on disk
      build-artifacts: dashboard-dist:Dashboard/dist
      dotnet-version: 10.0.x
      film-seconds: ${{ (github.event_name != 'workflow_dispatch' || inputs.film) && 60 || 0 }}
      live-dashboard: ${{ github.event_name != 'workflow_dispatch' || inputs.live-dashboard }}
      publish-report: true
      run-timeout: 25
      timeout-minutes: 45

  suite-windows:
    name: suite (windows)
    needs: [dashboard, game-image]
    # mod-ci's game-image.yml downloads the linux depot, so this leg runs on the ref built here
    if: needs.game-image.outputs.windows-image-ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      REPORT_DIR: ${{ github.workspace }}/pickle-reports
    steps:
      - uses: actions/checkout@v7

      # the verdict inside the action is node
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: ./.github/actions/build-mod

      # the pickle-run action, not a second pickle-suite.yml call: two calls in one run collide on
      # the reusable's merged-report artifact and each merge swallows the other call's legs
      - uses: RimWorks/mod-ci/.github/actions/pickle-run@v1
        with:
          game-image: ${{ needs.game-image.outputs.windows-image-ref }}
          mod-name: Pickle
          mod-package-id: rimworks.pickle
          pickle-version: self
          unfiltered: true
          backend: harmony
          platform: windows
          set-name: windows
          run-timeout: 25
          timeout-minutes: 45
          report-dir: ${{ env.REPORT_DIR }}

      # not pickle-report-*: that stem is what the linux call's merge job downloads, and this leg
      # is not one of its legs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
