name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install
        working-directory: Dashboard
        run: npm ci

      - name: Lint
        working-directory: Dashboard
        run: npm run lint

      - name: Build
        working-directory: Dashboard
        run: npm run build

      # The mod embeds these as resources, so the C# job needs them.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: Dashboard/dist

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # reviewdog
        with:
          reporter: github-pr-check
          fail_on_error: true

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Relative links break silently when a folder is renamed, which is how the
      # docs -> Docs rename broke the template's link to the authoring guide.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md 'Docs/**/*.md'
          fail: true

  game-image:
    name: rimworld 1.6 image
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - name: Build RimWorld 1.6 game image
        id: image
        uses: cryptiklemur/steam-game-image-action@v1
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          app-id: '294100'
          branch: 'version-1.6.4633'
          image: ghcr.io/${{ github.repository_owner }}/rimworld-game
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          include-paths: RimWorldLinux_Data/Managed

  build:
    name: build and test
    needs: [dashboard, game-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: Dashboard/dist

      - name: Stage game assemblies from image
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$GAME_IMAGE"
          cid="$(docker create "$GAME_IMAGE")"
          mkdir -p "$RUNNER_TEMP/rimworld"
          docker cp "$cid:/game/RimWorldLinux_Data" "$RUNNER_TEMP/rimworld/RimWorldLinux_Data"
          docker rm -f "$cid"

      - name: dotnet build (Krafs reference assemblies)
        run: dotnet build Pickle.slnx -c Release

      - name: Run tests
        run: dotnet test Pickle.slnx -c Release --no-build
