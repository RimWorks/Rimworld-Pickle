name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      live-dashboard:
        description: Expose Pickle's dashboard over a temporary public URL while the suite runs.
        type: boolean
        default: true
      film:
        description: Record filmed scenarios.
        type: boolean
        default: true
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''
      backend:
        description: Which patch backend to run. Empty runs all three.
        type: string
        default: ''
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
      DOCBIN_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      live-dashboard:
        description: Expose Pickle's dashboard over a temporary public URL while the suite runs.
        type: boolean
        default: true
      film:
        description: Record filmed scenarios.
        type: boolean
        default: true
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''
      backend:
        description: Which patch backend to run. A manual run does one, not all three.
        type: choice
        options: [harmony, concord, both]
        default: harmony

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    uses: RimWorks/mod-ci/.github/workflows/node-build.yml@af064c716a33a2e81ee9f9504734c9fe06cd55e9 # v1.5.0
    with:
      working-directory: Dashboard
      lint: true
      artifact-name: dashboard-dist

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@eae5a8f32bee86128ae88bf8821ebaca65ddc1e9 # v1.4.1
    with:
      extra-command: python3 .github/scripts/check-step-docs.py

  links:
    uses: RimWorks/mod-ci/.github/workflows/links.yml@eae5a8f32bee86128ae88bf8821ebaca65ddc1e9 # v1.4.1
    with:
      args: --config lychee.toml --no-progress README.md 'Docs/**/*.md'

  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  build:
    name: build and test
    needs: dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-mod

      - name: Run tests
        run: |
          dotnet test Pickle.slnx -c Release --no-build \
            --logger "trx;LogFileName=tests.trx" --results-directory "$RUNNER_TEMP/test-results"

      - name: Publish the test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: unit tests
          path: ${{ runner.temp }}/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: dotnet format
        run: dotnet format Pickle.slnx --verify-no-changes

  suite:
    name: suite (${{ matrix.backends }})
    needs: [dashboard, game-image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        backends: ${{ inputs.backend != ''
          && fromJSON(format('["{0}"]', inputs.backend))
          || (github.event_name == 'pull_request'
          && fromJSON('["harmony"]')
          || fromJSON('["harmony","concord","both"]')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-mod

      - name: Stage mods and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-pickle-mods.sh \
            "${{ matrix.backends }}" "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config"

      - name: Run the suite
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_DASHBOARD: ${{ github.event_name != 'workflow_dispatch' || inputs.live-dashboard }}
          FILM_SECONDS: ${{ github.event_name == 'workflow_dispatch' && !inputs.film && '0' || '60' }}
          SUITE_FILTER: ${{ inputs.suite-filter }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          .github/scripts/run-suite.sh \
            "${{ needs.game-image.outputs.image-ref }}" \
            "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config" "$PWD/pickle-reports"

      - name: Publish the counts
        if: always()
        run: |
          {
            echo "## Pickle suite (${{ matrix.backends }})"
            if [ -f pickle-reports/summary.md ]; then
              tail -n +2 pickle-reports/summary.md
            else
              echo "The run produced no summary. Read Player.log in the artifact below."
            fi
            echo
            echo "[Download **pickle-report-${{ matrix.backends }}**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
            echo "for \`report.html\` (open it in a browser; failures carry screenshots),"
            echo "plus \`junit.xml\` and the full \`Player.log\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the scenario results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: suite (${{ matrix.backends }})
          path: pickle-reports/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Publish the report
        if: always()
        env:
          DOCBIN_TOKEN: ${{ secrets.DOCBIN_TOKEN }}
        run: |
          if [[ -z "${DOCBIN_TOKEN:-}" ]] || [[ ! -f pickle-reports/report.html ]]; then
            echo "skipping docbin upload (no token or no report)"
            exit 0
          fi

          name="pickle-${{ matrix.backends }}-${{ github.run_id }}"
          out="$(npx -y docbin@1 push pickle-reports/report.html \
            --name "$name" --type html --visibility unlisted --expires 30d 2>&1 | head -1)"
          url="${out%% (*}"

          if [[ "$url" == https://* ]]; then
            echo "::notice title=Pickle report::${url}"
            echo "<a href=\"${url}\" target=\"_blank\" rel=\"noopener\"><strong>Open the report</strong></a> - failures carry screenshots." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docbin upload did not return a url: $out"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pickle-report-${{ matrix.backends }}
          path: pickle-reports/
          if-no-files-found: warn

  suite-windows:
    name: suite (windows)
    needs: [dashboard, game-image]
    if: needs.game-image.outputs.windows-image-ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-mod

      - name: Stage mods and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-pickle-mods.sh \
            harmony "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config-src"

          mkdir -p "$RUNNER_TEMP/config/Config"
          cp "$RUNNER_TEMP/config-src"/* "$RUNNER_TEMP/config/Config/"
          chmod -R 777 "$RUNNER_TEMP/config"

      - name: Run the suite
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          .github/scripts/run-suite-windows.sh \
            "${{ needs.game-image.outputs.windows-image-ref }}" \
            "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config" "$PWD/pickle-reports"

      - name: Publish the counts
        if: always()
        run: |
          {
            echo "## Pickle suite (windows)"
            if [ -f pickle-reports/summary.md ]; then
              tail -n +2 pickle-reports/summary.md
            else
              echo "The run produced no summary. Read Player.log in the artifact below."
              echo
              echo "Last lines of the container log:"
              echo '```'
              tail -20 "$RUNNER_TEMP/container.log" 2>/dev/null || echo "(none)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pickle-report-windows
          path: pickle-reports/
          if-no-files-found: warn
