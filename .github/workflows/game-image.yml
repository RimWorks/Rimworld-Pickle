name: game image

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
    outputs:
      image-ref:
        description: Image ref the suite and build jobs should pull.
        value: ${{ jobs.image.outputs.image-ref }}
      windows-image-ref:
        description: Image ref the Windows suite should pull.
        value: ${{ jobs.image-windows.outputs.image-ref }}
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  image:
    name: rimworld 1.6 image
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      skipped: ${{ steps.image.outputs.skipped }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build RimWorld 1.6 game image
        id: image
        uses: RimWorks/steam-game-image-action@187e9b65e5495b62bba77b45830e648ffae20169 # v2.0.0
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          app-id: '294100'
          branch: 'version-1.6.4633'
          image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          skip-if-unchanged: ${{ inputs.force && 'false' || 'true' }}

      - uses: RimWorks/steam-game-image-action/.github/actions/ghcr-private-check@187e9b65e5495b62bba77b45830e648ffae20169 # v2.0.0
        with:
          package: rimworld-game-runnable

      - name: Report what was built
        run: |
          {
            echo "## RimWorld game image"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ref | \`${{ steps.image.outputs.image-ref }}\` |"
            echo "| steam buildid | ${{ steps.image.outputs.buildid }} |"
            echo "| rebuilt | ${{ steps.image.outputs.skipped == 'true' && 'no, buildid unchanged' || 'yes' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  image-windows:
    name: rimworld 1.6 windows image
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      skipped: ${{ steps.image.outputs.skipped }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build RimWorld 1.6 Windows game image
        id: image
        uses: RimWorks/steam-game-image-action@187e9b65e5495b62bba77b45830e648ffae20169 # v2.0.0
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          app-id: '294100'
          branch: 'version-1.6.4633'
          steam-platform: windows
          base-image: ghcr.io/rimworks/steam-game-image-action/runtime-base-proton:latest
          image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable-windows
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          skip-if-unchanged: ${{ inputs.force && 'false' || 'true' }}

      - uses: RimWorks/steam-game-image-action/.github/actions/ghcr-private-check@187e9b65e5495b62bba77b45830e648ffae20169 # v2.0.0
        with:
          package: rimworld-game-runnable-windows
