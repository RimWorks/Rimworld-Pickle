name: game image

# the image is rebuilt weekly so a suite run never waits on a steam download
on:
  workflow_call:
    inputs:
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
    outputs:
      image-ref:
        description: Image ref the suite and build jobs should pull.
        value: ${{ jobs.image.outputs.image-ref }}
      windows-image-ref:
        description: Image ref the Windows suite should pull.
        value: ${{ jobs.image.outputs.windows-image-ref }}
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  image:
    name: rimworld 1.6 image
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      branch: version-1.6.4633
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
      windows: true
      force: ${{ inputs.force || false }}
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
