name: game image

# the image is rebuilt weekly so a suite run never waits on a steam download
on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Names the per-leg ref artifacts. Two calls in one run must not share it.
        type: string
        required: true
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
      windows:
        description: Also build the Windows images. A caller that only compiles does not need them.
        type: boolean
        default: true
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
    outputs:
      image-refs:
        description: JSON map of game version to image ref, for the suite and build jobs.
        value: ${{ jobs.image.outputs.image-refs }}
      windows-image-refs:
        description: The same map for the Windows images.
        value: ${{ jobs.image.outputs.windows-image-refs }}
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  image:
    name: rimworld images
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v4
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: ${{ inputs.artifact-prefix || 'scheduled-image-ref' }}
      # one image name is enough: game-image.yml tags it latest-<branch-slug>
      branches: |
        1.5=version-1.5
        1.6=public
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
      windows: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.windows }}
      force: ${{ inputs.force || false }}
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
