name: coex repro

# throwaway: 104 boots across three arms, hunting the boehm segv that only fires on a runner.
# every leg carries a catcher that cores the game on a real segv. delete once the answer is known.

on:
  push:
    branches: [ci/coex-arms]

permissions:
  contents: read

concurrency:
  group: coex-repro-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_IMAGE: ghcr.io/rimworks/rimworld-game-runnable:latest-version-1.6.4633

jobs:
  dashboard:
    uses: RimWorks/mod-ci/.github/workflows/node-build.yml@v1
    with:
      working-directory: Dashboard
      lint: false
      artifact-name: dashboard-dist

  leg:
    name: ${{ matrix.label }}
    needs: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        label: [gcoff-1, gcoff-2, gcoff-3, gcoff-4, gcoff-5, gcoff-6, gcoff-7, gcoff-8, gcoff-9, gcoff-10, gcoff-11, gcoff-12, gcoff-13, gcoff-14, gcoff-15, gcoff-16, gcoff-17, gcoff-18, gcoff-19, gcoff-20, gcoff-21, gcoff-22, gcoff-23, gcoff-24, gcoff-25, gcoff-26, gcoff-27, gcoff-28, gcoff-29, gcoff-30, gcoff-31, gcoff-32, gcoff-33, gcoff-34, gcoff-35, gcoff-36, gcoff-37, gcoff-38, gcoff-39, gcoff-40, gcoff-41, gcoff-42, gcoff-43, gcoff-44, gcoff-45, gcoff-46, gcoff-47, gcoff-48, gcoff-49, gcoff-50, gcoff-51, gcoff-52, gcoff-53, gcoff-54, gcoff-55, gcoff-56, gcoff-57, gcoff-58, gcoff-59, gcoff-60, gcoff-61, gcoff-62,
                ctl-1, ctl-2, ctl-3, ctl-4, ctl-5, ctl-6, ctl-7, ctl-8, ctl-9, ctl-10, ctl-11, ctl-12, ctl-13, ctl-14, ctl-15, ctl-16, ctl-17, ctl-18, ctl-19, ctl-20, ctl-21, ctl-22, ctl-23, ctl-24, ctl-25, ctl-26, ctl-27, ctl-28, ctl-29, ctl-30, ctl-31, ctl-32, ctl-33, ctl-34, ctl-35, ctl-36, ctl-37, ctl-38, ctl-39, ctl-40]
    env:
      REPORT_DIR: ${{ github.workspace }}/pickle-reports
      MODS_DIR: /tmp/stage/mods
      CONFIG_DIR: /tmp/stage/config
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Name the arm this leg runs
        env:
          label: ${{ matrix.label }}
        run: echo "ARM=${label%%-*}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: ./.github/actions/build-mod

      - uses: actions/checkout@v7
        with:
          repository: RimWorks/mod-ci
          ref: v1
          path: .mod-ci

      - name: Install the capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb zstd
          gcore --help > /dev/null && echo "gcore ok"
          df -h / | tail -1

      - name: Stage the mods and config
        env:
          MOD_NAME: Pickle
          MOD_PACKAGE_ID: rimworks.pickle
          PICKLE_VERSION: self
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$ARM" in
            gcoff|ctl) backend=both ;;
            *) echo "::error::arm '$ARM' is not gcoff or ctl"; exit 1 ;;
          esac
          .mod-ci/.github/actions/stage-mods/stage-mods.sh "$backend" "$MODS_DIR" "$CONFIG_DIR"

          hdll=$(find "$MODS_DIR" -name '0Harmony.dll' | wc -l)
          cdll=$(find "$MODS_DIR" -iname 'Concord*.dll' | wc -l)
          echo "staged-on-disk 0Harmony=$hdll Concord=$cdll"
          echo "STAGED_HARMONY_DLLS=$hdll" >> "$GITHUB_ENV"
          echo "STAGED_CONCORD_DLLS=$cdll" >> "$GITHUB_ENV"

      - name: Check the staging matches the arm
        run: |
          fail=0
          [[ "$STAGED_HARMONY_DLLS" -gt 0 ]] || { echo "::error::staged no 0Harmony.dll"; fail=1; }
          [[ "$STAGED_CONCORD_DLLS" -gt 0 ]] || { echo "::error::staged no Concord dll"; fail=1; }
          exit "$fail"

      - name: Turn incremental marking off
        if: startsWith(matrix.label, 'gcoff-')
        run: |
          cp .mod-ci/.github/actions/pickle-run/run-suite.sh "$RUNNER_TEMP/run-suite.sh"
          sed -i 's|^docker run --rm --name "pickle-suite\${SET_NAME:+-\$SET_NAME}" \\|&\n  -e GC_DISABLE_INCREMENTAL=1 \\|' \
            "$RUNNER_TEMP/run-suite.sh"
          grep -n 'GC_DISABLE_INCREMENTAL' "$RUNNER_TEMP/run-suite.sh"

      - name: Run the suite behind the catcher
        env:
          SET_NAME: ${{ matrix.label }}
          UNFILTERED: 'true'
          FILM_SECONDS: '0'
          RUN_TIMEOUT: '25'
        run: |
          mkdir -p "$REPORT_DIR" "$RUNNER_TEMP/cdump"

          sudo -n .github/coex/catch.sh "$REPORT_DIR/Player.log" "$RUNNER_TEMP/cdump" < /dev/null &
          echo "catcher armed"

          runner=.mod-ci/.github/actions/pickle-run/run-suite.sh
          [[ -f "$RUNNER_TEMP/run-suite.sh" ]] && runner="$RUNNER_TEMP/run-suite.sh"
          echo "runner=$runner"

          ( for _ in $(seq 1 600); do
              gp="$(pgrep -x RimWorldLinux | head -1)"
              if [[ -n "$gp" ]]; then
                sudo -n tr '\0' '\n' < "/proc/$gp/environ" | grep -c '^GC_DISABLE_INCREMENTAL=1$' \
                  > "$RUNNER_TEMP/envproof" 2>/dev/null || true
                break
              fi
              sleep 0.5
            done ) &

          "$runner" "$GAME_IMAGE" "$MODS_DIR" "$CONFIG_DIR" "$REPORT_DIR" || echo "suite exit $?"

          # a fired catcher kills the game to get here, so it is still coring right now
          if grep -q STOPPED "$RUNNER_TEMP/cdump/catch.log" 2>/dev/null; then
            echo "catcher fired, waiting for the core"
            for _ in $(seq 1 300); do
              grep -q DONE "$RUNNER_TEMP/cdump/catch.log" && break
              sleep 1
            done
          fi
          sudo -n pkill -f 'coex/catch.sh' 2>/dev/null || true
          cat "$RUNNER_TEMP/cdump/catch.log" 2>/dev/null || echo "no catch.log"
          df -h / | tail -1

      - name: Check the leg ran the arm it claims
        if: always()
        run: |
          log="$REPORT_DIR/Player.log"
          [[ -f "$log" ]] || { echo "::error::no Player.log, void"; exit 1; }

          bridge=$(grep -c 'bridge-active' "$log" || true)
          coex=$(grep -c 'Concord\.Coex' "$log" || true)
          concord=$(grep -c 'patched via Concord' "$log" || true)
          harmony=$(grep -c 'patched via Harmony' "$log" || true)
          idle=$(grep -c 'idle: Harmony' "$log" || true)
          nobridge=$(grep -c 'Harmony not present; bridge cannot be loaded' "$log" || true)
          anyconcord=$(grep -ci 'concord' "$log" || true)
          segv=$(grep -c 'signo:11' "$log" || true)
          fatal=$(grep -c 'Caught fatal signal' "$log" || true)
          echo "arm=$ARM bridge=$bridge coex=$coex concord=$concord harmony=$harmony idle=$idle nobridge=$nobridge anyconcord=$anyconcord segv=$segv fatal=$fatal"

          fail=0
          [[ "$bridge" == 2 ]] || { echo "::error::bridge-active is $bridge, not 2, void"; fail=1; }
          [[ "$idle" -ge 1 ]] || { echo "::error::no 'idle: Harmony' line, void"; fail=1; }

          proof=$(cat "$RUNNER_TEMP/envproof" 2>/dev/null || echo missing)
          echo "envproof=$proof"
          case "$ARM" in
            gcoff)
              [[ "$proof" == 1 ]] || { echo "::error::GC_DISABLE_INCREMENTAL not in the game process environ (got '$proof'), void"; fail=1; }
              ;;
            ctl)
              [[ "$proof" == 0 ]] || { echo "::error::a control leg had GC_DISABLE_INCREMENTAL set (got '$proof'), void"; fail=1; }
              ;;
          esac

          {
            echo "### ${{ matrix.label }}"
            echo ""
            echo "arm=$ARM segv=$segv fatal=$fatal bridge=$bridge coex=$coex"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coex-${{ matrix.label }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn

      - name: Make the core readable
        if: always()
        run: sudo -n chmod -R a+rX "$RUNNER_TEMP/cdump" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-${{ matrix.label }}
          # never the raw core: gcore writes it sparse at 19 GB apparent
          path: |
            ${{ runner.temp }}/cdump/*.zst
            ${{ runner.temp }}/cdump/catch.log
            ${{ runner.temp }}/cdump/maps.txt
          if-no-files-found: ignore
          compression-level: 0

  tally:
    needs: leg
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: coex-*
          path: legs

      - name: Count what each arm actually reported
        run: |
          declare -A expected=([gcoff]=62 [ctl]=40)
          fail=0
          for arm in gcoff ctl; do
            got=$(find legs -name Player.log -path "*/coex-$arm-*" | wc -l)
            segv=$(grep -rl 'signo:11' legs --include=Player.log 2>/dev/null | grep -c "/coex-$arm-" || true)
            echo "$arm: $got of ${expected[$arm]} legs reported, $segv segv" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$got" != "${expected[$arm]}" ]]; then
              echo "::error::$arm produced $got legs, not ${expected[$arm]}, so this run is void"
              fail=1
            fi
          done
          exit "$fail"
