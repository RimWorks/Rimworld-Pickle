name: weekly-verify

on:
  schedule:
    - cron: '0 14 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: rimworld images
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: weekly-image-ref
      windows: false
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  verify:
    name: verify against current RimWorld, then republish
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      # stage-game-refs pulls the images from ghcr
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        run: npm --prefix Dashboard ci --ignore-scripts

      - name: Build dashboard
        run: npm --prefix Dashboard run build

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v3
        id: refs-15
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game-1.5

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v3
        id: refs-16
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game-1.6

      # GameManagedDir so dotnet test evaluates the props without hard-erroring, and the per
      # version names so the build loop below and release.config.mjs read the same variables
      - name: Name the staged directories
        env:
          MANAGED_15: ${{ steps.refs-15.outputs.managed-dir }}
          MANAGED_16: ${{ steps.refs-16.outputs.managed-dir }}
        run: |
          {
            echo "GAME_MANAGED_1_5=$MANAGED_15"
            echo "GAME_MANAGED_1_6=$MANAGED_16"
            echo "GameManagedDir=$MANAGED_16"
          } >> "$GITHUB_ENV"

      - name: dotnet restore
        run: dotnet restore Pickle.slnx

      - name: Record resolved RimWorld version
        run: |
          version=$(cat "${{ steps.refs-16.outputs.managed-dir }}/Version.txt")
          echo "RIMWORLD_REF=$version" >> "$GITHUB_ENV"
          echo "resolved RimWorld ref: $version"

      # the republish uploads the working tree, so every version the mod claims needs a folder
      - name: dotnet build
        run: |
          npx build-mod Pickle.slnx --nologo --no-restore
          npx verify-ship-list .

      - name: dotnet test
        run: |
          set -o pipefail
          dotnet test Pickle.slnx -c Release --nologo --no-build \
            --logger "console;verbosity=normal" | tee test-output.txt
          passed=$(grep -oE 'Passed:[[:space:]]+[0-9]+' test-output.txt | grep -oE '[0-9]+' | tail -1)
          echo "TESTS_PASSED=${passed:-unknown}" >> "$GITHUB_ENV"

      - uses: RimWorks/mod-ci/.github/actions/steam-republish@v3
        with:
          solution: Pickle.slnx
          workshop-id: ${{ vars.WORKSHOP_ID }}
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          verified-rimworld: ${{ env.RIMWORLD_REF }}
          verified-tests: ${{ env.TESTS_PASSED }}
