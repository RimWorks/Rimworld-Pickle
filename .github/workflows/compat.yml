name: compat

# Weekly comparison run: one suite leg per mod combination in compat-sets.json. A red set is the
# answer, so the legs report instead of gating - mod-sets is what turns that on in the reusable.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: compat
  cancel-in-progress: true

jobs:
  # a `uses:` job cannot run steps, so the file has to be read into an output first. the reusable
  # checks the names, the duplicates and the backends.
  sets:
    name: read compat-sets.json
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.read.outputs.sets }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the sets
        id: read
        run: |
          set -euo pipefail
          sets="$(jq -c '.sets' compat-sets.json)"
          echo "sets=$sets" >> "$GITHUB_OUTPUT"
          jq . <<< "$sets"

  dashboard:
    name: dashboard
    uses: RimWorks/mod-ci/.github/workflows/node-build.yml@v1
    with:
      working-directory: Dashboard
      artifact-name: dashboard-dist

  # ci.yml calls this too, so the steam branch and the image name stay pinned in one place
  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  suite:
    name: suite
    needs: [sets, dashboard, game-image]
    uses: RimWorks/mod-ci/.github/workflows/pickle-suite.yml@v1
    permissions:
      contents: read
      # write, not read: the reusable's game-image job declares it, and a caller is checked
      # against every nested job whether or not the if: skips it
      packages: write
      # the reusable reads this run's dashboard artifact through the api
      actions: read
    with:
      game-image: ${{ needs.game-image.outputs.image-ref }}
      mod-name: Pickle
      mod-package-id: rimworks.pickle
      # the checkout is Pickle, so no release is staged over it
      pickle-version: self
      mod-sets: ${{ needs.sets.outputs.sets }}
      suite-filter: ${{ inputs.suite-filter }}
      # every discovered feature, including the ones the sets' own mods ship
      unfiltered: true
      build-command: dotnet build Pickle.slnx -c Release
      # the dashboard bundles are embedded resources, so the build needs them on disk
      build-artifacts: dashboard-dist:Dashboard/dist
      dotnet-version: 10.0.x
      # (0 retries + 1) * 30 + 15 for checkout, build, the pull and staging = 45, under the 50
      run-timeout: 30
      timeout-minutes: 50
