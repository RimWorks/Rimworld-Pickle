name: compat

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      suite-filter:
        description: Passed to -pickle-run. Empty runs the whole suite.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: compat
  cancel-in-progress: true

jobs:
  sets:
    name: read compat-sets.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the sets
        id: read
        run: |
          matrix="$(jq -c '{set: .sets}' compat-sets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  dashboard:
    name: dashboard
    uses: RimWorks/mod-ci/.github/workflows/node-build.yml@d6261858b6b74c0cd3ca03c6402c954d58ac7fee # v1.5.1
    with:
      working-directory: Dashboard
      artifact-name: dashboard-dist

  game-image:
    name: rimworld 1.6 image
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  suite:
    name: suite (${{ matrix.set.name }})
    needs: [sets, dashboard, game-image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-mod

      - name: Stage mods and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-pickle-mods.sh \
            "${{ matrix.set.backend }}" "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config" \
            "${{ matrix.set.extraMods }}"

      - name: Run the suite
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE_FILTER: ${{ inputs.suite-filter }}
          SET_NAME: ${{ matrix.set.name }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          .github/scripts/run-suite.sh \
            "${{ needs.game-image.outputs.image-ref }}" \
            "$RUNNER_TEMP/mods" "$RUNNER_TEMP/config" "$PWD/pickle-reports" \
            || echo "set $SET_NAME exited $?"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: compat-${{ matrix.set.name }}
          path: pickle-reports/

  merge:
    name: merged report
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: compat-*
          path: sets

      - name: Merge the reports
        run: |
          mapfile -t reports < <(find sets -name report.html | sort)
          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "::error title=Pickle compat::no set produced a report"
            exit 1
          fi

          python3 .github/scripts/merge-reports.py merged.html "${reports[@]}"

          for dir in sets/compat-*/screenshots/film; do
            [[ -d "$dir" ]] || continue
            set_name="$(basename "$(dirname "$(dirname "$dir")")")"
            mkdir -p "screenshots/${set_name#compat-}"
            cp -r "$dir" "screenshots/${set_name#compat-}/film"
          done

      - name: Publish the counts
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          print("## Pickle compat\n")
          print("| Set | Result |")
          print("|---|---|")
          for summary in sorted(pathlib.Path("sets").glob("compat-*/summary.json")):
              d = json.loads(summary.read_text())
              name = d.get("setName") or summary.parent.name
              print(f"| {name} | {d['passed']} passed, {d['failed']} failed, "
                    f"{d['skipped']} skipped ({d['exitReason']}) |")

          print("\nDownload **merged-report** below and open `merged.html`. Select "
                "**Compare sets** to see which scenario broke under which set.")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: merged-report
          path: |
            merged.html
            screenshots/
