StylesPath = Styles
MinAlertLevel = warning

Packages = Google

Vocab = Pickle

[*.md]
BasedOnStyles = Vale, Google, Pickle

# Headings here are sentence case, which Google agrees with, but the rule fires on
# type names like RunSession that have to keep their casing.
Google.Headings = NO

# Pickle's docs are for mod authors reading alongside an IDE. "will" is fine.
Google.Will = NO

# Reads a dotted identifier such as Pickle.Core as two sentences and asks for a
# space between them.
Google.Spacing = NO

# Matches any word ending in "ly" before a hyphen, so it rejects correct compounds
# such as assembly-qualified.
Google.LyHyphens = NO

# Fires on a capitalised link title after a colon.
Google.Colons = NO

# Vocabulary terms are flagged when a sentence starts with one, because
# sentence-initial capitals read as inconsistent casing.
Vale.Terms = NO
